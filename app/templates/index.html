{% extends "base.html" %}
{% block content %}
<h2>Últimos Treinos</h2>

{% for w in workouts %}
<div class="ios-card">
    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px;">
        <h3 style="font-size: 18px; font-weight: 600;">{{ w.category }}</h3>
        <span style="font-size: 13px; color: var(--ios-subtext);">{{ w.date }}</span>
    </div>
    <p style="font-size: 14px; color: var(--ios-subtext); margin-bottom: 12px;">{{ w.notes or 'Sem notas registadas.' }}</p>
    <a href="{{ url_for('workouts.workout_detail', workout_id=w.id) }}" class="ios-btn ios-btn-secondary" style="font-size: 14px; padding: 8px;">Ver Séries</a>
</div>
{% else %}
<div class="ios-card" style="text-align: center; color: var(--ios-subtext);">
    <p>Ainda não tens treinos registados.</p>
</div>
{% endfor %}
{% endblock %}
