<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>{% block title %}Gym Tracker{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <!-- iOS Top Navigation Header -->
    <header class="ios-header">
        <div class="ios-header-content">
            <span class="ios-header-title">GymTracker</span>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="ios-container">
        {% block content %}{% endblock %}
    </main>

    <!-- iOS Bottom Tab Bar -->
    <nav class="ios-tab-bar">
        <a href="{{ url_for('workouts.index') }}" class="tab-item {% if request.endpoint == 'workouts.index' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Início</span>
        </a>
        <a href="{{ url_for('workouts.list_create_workouts') }}" class="tab-item {% if 'workouts' in request.endpoint and request.endpoint != 'workouts.index' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="14" x="6" y="5" rx="2"/><path d="M12 5v14"/></svg>
            <span>Treinos</span>
        </a>
        <a href="{{ url_for('body.body_tracking') }}" class="tab-item {% if 'body' in request.endpoint %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m16 12-4-4-4 4"/><path d="M12 16V8"/></svg>
            <span>Peso</span>
        </a>
        <a href="{{ url_for('analytics.analytics_view') }}" class="tab-item {% if 'analytics' in request.endpoint %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            <span>Evolução</span>
        </a>
    </nav>

</body>
</html>
