{% extends "base.html" %}
{% block content %}
<h2>Peso Corporal</h2>

<div class="ios-card">
    <div class="ios-card-title">Novo Registo</div>
    <form method="POST">
        <div class="ios-input-group">
            <input type="date" name="date" class="ios-input" value="{{ today }}" required>
            <input type="number" step="0.1" name="weight" class="ios-input" placeholder="Peso em kg (ex: 74.5)" required>
            <input type="text" name="notes" class="ios-input" placeholder="Notas (ex: em jejum, pós-treino)">
        </div>
        <button type="submit" class="ios-btn">Guardar Registo</button>
    </form>
</div>

<div class="ios-card">
    <div class="ios-card-title">Histórico Recente</div>
    <ul class="ios-list">
        {% for r in records %}
        <li class="ios-list-item">
            <div>
                <strong>{{ r.date }}</strong>
                {% if r.notes %}
                <small style="display: block; color: var(--ios-subtext);">{{ r.notes }}</small>
                {% endif %}
            </div>
            <span style="font-size: 17px; font-weight: 600; color: var(--ios-green);">
                {{ r.weight }} kg
            </span>
        </li>
        {% else %}
        <li class="ios-list-item" style="color: var(--ios-subtext);">Nenhum registo de peso ainda.</li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
